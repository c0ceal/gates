
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatekeep</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: white;
      overflow-y: hidden;
    }

    body {
      overflow-x: auto;
    }

 #strip {
  display: flex;
  align-items: flex-end;
  width: max-content;
  height: 100vh;
}

    #strip img {
      display: block;
      flex: none;
      width: auto;
    }
  </style>
</head>

<body>
  <div id="strip"></div>

 
<script>
  // Change this when you add more images.
  const IMAGE_COUNT = 100;

  // How many images to load at a time.
  const BATCH_SIZE = 8;

  // Maximum images kept on the page.
  const MAX_VISIBLE = 40;

  const strip = document.getElementById("strip");
  const viewport = document.body;

  let deck = [];
  let previous = 0;
  let loading = false;

  // Shuffle every image before repeating the collection.
  function nextGate() {
    if (deck.length === 0) {
      deck = Array.from(
        { length: IMAGE_COUNT },
        (_, i) => i + 1
      );

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      // Avoid the same image at the boundary.
      if (
        deck.length > 1 &&
        deck[deck.length - 1] === previous
      ) {
        [deck[0], deck[deck.length - 1]] =
          [deck[deck.length - 1], deck[0]];
      }
    }

    previous = deck.pop();
    return previous;
  }

  // Load a small group of images.
  async function addGates() {
    if (loading) return;
    loading = true;

    const images = [];

    for (let i = 0; i < BATCH_SIZE; i++) {
      const img = new Image();

      img.src = `gate${nextGate()}.jpeg`;
      img.alt = "Gate";

      img.style.height =
        `${45 + Math.round(Math.random() * 40)}vh`;

      images.push(img);
    }

    // Wait until dimensions are available.
    await Promise.all(
      images.map(img => img.decode().catch(() => {}))
    );

    strip.append(...images);

    // Remove gates far behind the viewer.
    let removedWidth = 0;

    while (strip.children.length > MAX_VISIBLE) {
      const first = strip.firstElementChild;
      removedWidth += first.getBoundingClientRect().width;
      first.remove();
    }

    // Preserve the viewer's position.
    if (removedWidth > 0) {
      viewport.scrollLeft -= removedWidth;
    }

    loading = false;
    checkScroll();
  }

  // Add more gates before reaching the end.
  function checkScroll() {
    const remaining =
      viewport.scrollWidth -
      viewport.scrollLeft -
      viewport.clientWidth;

    if (remaining < 2000 && !loading) {
      addGates();
    }
  }

  viewport.addEventListener("scroll", checkScroll);

  // Allow vertical mouse scrolling to move horizontally.
  window.addEventListener("wheel", event => {
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
      event.preventDefault();
      viewport.scrollLeft += event.deltaY;
    }
  }, { passive: false });

  // Begin the procession.
  addGates();
</script>
</body>
</html>
